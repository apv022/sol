<!doctype html>
<html lang="en" data-wallpaper="dusk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sol</title>
<link rel="stylesheet" href="/kit/tokens.css">
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/wallpaper.css">
<link rel="stylesheet" href="/home.css">
</head>
<body>
<div id="wallpaper" class="wp wallpaper" aria-hidden="true"><div class="sun"></div></div>
<div id="shell" class="shell" data-route="home">
  <nav id="side" class="sidebar glass" aria-label="Sol"></nav>
  <main id="main" tabindex="-1"></main>
  <nav id="dock" class="dock glass" aria-label="Dock"></nav>
  <nav id="tabs" class="tabbar glass" aria-label="Sections"></nav>
</div>
<section id="locked" class="locked" hidden>
  <div class="locked-card glass">
    <sol-app-icon glyph="sun" size="72px"></sol-app-icon>
    <h1>Open Sol from the app</h1>
    <p>Open Sol from the app or run <code>sol open</code>.</p>
  </div>
</section>
<script type="module" src="/app.js"></script>
</body>
</html>
