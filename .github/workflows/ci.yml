name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so a newly published vulnerability or a runner change turns CI red without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false # one OS failing must not hide the others' results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: test
        # The full -v log goes to an artifact; the step log shows only results and failures,
        # so a failure is readable without downloading anything.
        shell: bash
        run: |
          set +e
          go test -race -v ./... > test.log 2>&1
          rc=$?
          grep -E '^(--- FAIL|FAIL|ok |panic:)|_test\.go:[0-9]+:' test.log
          exit $rc
      - name: test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
      - name: build
        run: go build ./cmd/sol

  vuln:
    # Known vulnerabilities in the stdlib and modules this code actually calls. The Go version
    # comes from go.mod's toolchain line, so a stdlib fix means bumping that line.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
